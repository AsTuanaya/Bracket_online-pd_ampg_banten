<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Turnamen - PD AMPG Banten</title>
  <meta name="description" content="Bracket turnamen PD AMPG Banten - dapat diakses publik melalui internet.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2eadc;
      color: #172033;
    }
    header {
      text-align: center;
      padding: 28px 16px 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 38px);
    }
    p {
      margin: 8px 0 0;
      color: #5c6470;
    }
    main {
      width: min(1200px, 94vw);
      margin: 20px auto 40px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
      overflow: auto;
    }
    .bracket {
      display: block;
      width: 100%;
      height: auto;
      min-width: 800px;
    }
    .notice {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #687080;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bracket Turnamen PD AMPG Banten</h1>
    <p>Round 1 sampai Final</p>
  </header>

  <main>
    <div class="card">
      <img class="bracket" src="assets/bracket.jpg"
           alt="Bracket Turnamen PD AMPG Banten">
    </div>
    <div class="notice">
      Halaman ini dibuat agar bracket dapat dibuka dari HP, laptop, atau tablet.
    </div>
  </main>

  <footer>
    &copy; 2026 PD AMPG Banten
  </footer>
</body>
</html>
