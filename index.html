<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bracket Turnamen — PD AMPG Banten</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<header><div><small>PD AMPG BANTEN</small><h1>Bracket Turnamen</h1><p>Hasil pertandingan diperbarui secara real-time.</p></div>
<div><span id="status">Menghubungkan...</span> <button id="adminBtn">Panel Panitia</button></div></header>
<main><section class="hero"><h2 id="title">Turnamen PD AMPG Banten</h2><p id="updated">Menunggu data...</p></section><section id="bracket"></section></main>

<div id="modal" class="modal hidden"><div class="panel"><button id="close" class="x">×</button>
<div id="login"><h2>Login Panitia</h2><input id="email" type="email" placeholder="Email panitia"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="error"></p></div>
<div id="admin" class="hidden"><div class="adminhead"><h2>Panel Panitia</h2><button id="logout">Keluar</button></div>
<label>Nama Turnamen<input id="titleInput"></label><h3>Peserta / Pair — Round 1</h3><div id="teams"></div>
<h3>Hasil Pertandingan</h3><p class="muted">Isi skor dan pilih pemenang. Pemenang otomatis masuk ke babak berikutnya.</p><div id="matches"></div>
<button id="save">Simpan Perubahan</button><button id="reset" class="danger">Reset Bracket</button><p id="message"></p></div>
</div></div>
<script type="module" src="app.js"></script>
</body></html>
