<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Turnamen PD AMPG Banten - Bracket Turnamen Online"
    >

    <title>
        Turnamen PD AMPG Banten
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="main-header">

        <div class="header-inner">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="assets/logo-ampg.png"
                    alt="Golongan Karya PD AMPG Banten"
                    class="logo"
                >

            </div>


            <!-- JUDUL -->

            <div class="header-title">

                <h1>
                    TURNAMEN PD AMPG BANTEN
                </h1>

                <p>
                    BRACKET TURNAMEN ONLINE
                </p>

            </div>


            <!-- PANEL PANITIA -->

            <div class="header-action">

                <div
                    id="status"
                    class="status online"
                >
                    ● LIVE
                </div>


                <a
                    href="admin.html"
                    class="admin-button"
                >
                    ⚙ Panel Panitia
                </a>

            </div>

        </div>

    </header>



    <!-- =================================================
         INFORMASI TURNAMEN
    ================================================== -->

    <section class="tournament-info">

        <h2 id="title">
            TURNAMEN PD AMPG BANTEN
        </h2>


        <div
            id="updated"
            class="updated"
        >
            Belum ada pembaruan.
        </div>

    </section>



    <!-- =================================================
         BRACKET
    ================================================== -->

    <main class="bracket-wrapper">

        <div
            id="bracket"
            class="bracket"
        >

            <!-- Firebase akan mengisi bracket di sini -->

        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <div>
            © 2026 PD AMPG Banten
        </div>

        <div>
            Turnamen Online
        </div>

    </footer>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="app.js"
    ></script>


</body>

</html>
