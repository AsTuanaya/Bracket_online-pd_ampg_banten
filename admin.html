<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#092957"
    >

    <title>
        Login Panitia - PD AMPG Banten
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body class="admin-login-page">


    <!-- =====================================================
         BACKGROUND DECORATION
    ====================================================== -->

    <div class="login-decoration decoration-one"></div>

    <div class="login-decoration decoration-two"></div>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <main class="login-wrapper">


        <!-- LOGO -->

        <div class="login-logo">

            <img
                src="assets/logo-ampg.png"
                alt="Logo Golongan Karya PD AMPG Banten"
            >

        </div>


        <!-- TITLE -->

        <div class="login-heading">

            <div class="login-label">
                PANEL PANITIA
            </div>

            <h1>
                PD AMPG BANTEN
            </h1>

            <p>
                Bracket Turnamen Online
            </p>

        </div>


        <!-- LOGIN CARD -->

        <section class="login-card">


            <div class="login-card-header">

                <div class="login-icon">
                    🔐
                </div>

                <div>

                    <h2>
                        Login Panitia
                    </h2>

                    <p>
                        Masuk untuk mengelola pertandingan
                    </p>

                </div>

            </div>


            <!-- ERROR -->

            <div
                id="error"
                class="admin-error"
            ></div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Panitia
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    placeholder="Masukkan email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                >

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                id="loginBtn"
                class="login-button"
            >

                <span>
                    🔑
                </span>

                Masuk ke Panel Panitia

            </button>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-public"
            >

                ← Kembali ke Bracket Publik

            </a>


        </section>


        <!-- FOOTER -->

        <footer class="login-footer">

            <strong>
                PD AMPG Banten
            </strong>

            <span>•</span>

            Sistem Bracket Turnamen Online

        </footer>


    </main>


    <!-- =====================================================
         LOGIN SCRIPT
    ====================================================== -->

    <script
        type="module"
        src="admin-login.js"
    ></script>


</body>

</html>
